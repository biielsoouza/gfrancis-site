<!-- Mural de cotações (By trops). Lê /api/cotacoes, a função da Netlify que consulta a brapi.dev. -->
<style>
[data-mural] { min-width: 0; max-width: 100%; --m-alta: #0E9F6E; --m-baixa: #DC2626; --m-alta-bg: rgba(14,159,110,0.12); --m-baixa-bg: rgba(220,38,38,0.1); }
@media (prefers-color-scheme: dark) { [data-mural] { --m-alta: #34D399; --m-baixa: #F87171; --m-alta-bg: rgba(52,211,153,0.14); --m-baixa-bg: rgba(248,113,113,0.14); } }
:root[data-theme="dark"] [data-mural] { --m-alta: #34D399; --m-baixa: #F87171; --m-alta-bg: rgba(52,211,153,0.14); --m-baixa-bg: rgba(248,113,113,0.14); }
.mural-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.mural-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; display: grid; gap: 2px; min-width: 0; }
.mural-card .sim { font-weight: 800; font-size: 15px; letter-spacing: -0.01em; display: flex; justify-content: space-between; gap: 6px; align-items: center; }
.mural-card .nome { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mural-card .preco { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin-top: 6px; font-variant-numeric: tabular-nums; }
.mural-var { font-size: 12.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.mural-var.alta { color: var(--m-alta); background: var(--m-alta-bg); }
.mural-var.baixa { color: var(--m-baixa); background: var(--m-baixa-bg); }
.mural-var.zero { color: var(--ink-3); background: var(--line); }
.mural-tag { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-3); }
.mural-nota { font-size: 12.5px; color: var(--ink-3); margin-top: 10px; }
.mural-faixa { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: thin; }
/* Faixa que anda sozinha: duas cópias lado a lado; quando a primeira sai da tela, a segunda está no lugar dela. */
.mural-anda { overflow: hidden; padding: 2px 0 6px; -webkit-mask-image: linear-gradient(90deg, transparent, #000 40px, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(90deg, transparent, #000 40px, #000 calc(100% - 40px), transparent); }
.mural-trilho { display: flex; width: max-content; animation: mural-rola var(--mural-dur, 60s) linear infinite; }
.mural-grupo { display: flex; gap: 8px; padding-right: 8px; }
.mural-anda:hover .mural-trilho, .mural-anda:focus-within .mural-trilho { animation-play-state: paused; }
@keyframes mural-rola { to { transform: translateX(-50%); } }
/* Variante "topo": letreiro fixo no alto da página, sobre fundo escuro. */
[data-variante="topo"] { --m-alta: #34D399; --m-baixa: #F87171; --m-alta-bg: transparent; --m-baixa-bg: transparent; }
.mural-topo { display: flex; align-items: center; gap: 10px; min-height: 36px; color: #FFFFFF; font-size: 13px; }
.mural-topo .mural-anda { flex: 1; min-width: 0; padding: 0; }
.mural-topo .mural-grupo { gap: 0; padding-right: 0; }
.mural-topo .mural-chip { background: transparent; border: 0; border-radius: 0; padding: 0 16px; border-right: 1px solid rgba(255,255,255,0.12); font-size: 13px; gap: 7px; }
.mural-topo .mural-chip .p { color: rgba(255,255,255,0.78); }
.mural-topo .mural-var { padding: 0; font-size: 12.5px; }
.mural-topo .mural-var.zero { background: transparent; color: rgba(255,255,255,0.55); }
.mural-selo { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: rgba(255,255,255,0.6); cursor: help; white-space: nowrap; }
.mural-selo i { width: 7px; height: 7px; border-radius: 50%; background: #34D399; box-shadow: 0 0 0 3px rgba(52,211,153,0.2); }
.mural-selo.fechado i { background: rgba(255,255,255,0.45); box-shadow: none; }
.mural-topo .mural-esq { background: rgba(255,255,255,0.1); min-height: 16px; width: 120px; border-radius: 6px; }
@media (max-width: 560px) { .mural-selo span { display: none; } }
@media (prefers-reduced-motion: reduce) {
  .mural-anda { overflow-x: auto; -webkit-mask-image: none; mask-image: none; }
  .mural-trilho { animation: none; }
  .mural-grupo[aria-hidden="true"] { display: none; }
}
.mural-chip { flex: none; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 8px 7px 14px; font-size: 13.5px; white-space: nowrap; }
.mural-chip b { font-weight: 800; }
.mural-chip .p { font-variant-numeric: tabular-nums; color: var(--ink-2); }
.mural-esq { background: var(--line); border-radius: 18px; min-height: 92px; animation: mural-pulsa 1.4s ease-in-out infinite; }
.mural-faixa .mural-esq { min-height: 34px; width: 150px; flex: none; border-radius: 999px; }
@keyframes mural-pulsa { 50% { opacity: 0.5; } }
@media (prefers-reduced-motion: reduce) { .mural-esq { animation: none; } }
</style>
<script>
(function () {
  const caixas = document.querySelectorAll("[data-mural]");
  if (!caixas.length) return;
  // Idioma: segue o <html lang> da página (pt-BR na principal, en em /en/).
  const EN = (document.documentElement.lang || "").toLowerCase().startsWith("en");
  const T = (pt, en) => (EN ? en : pt);
  const NOMES_EN = { "Dólar comercial": "US dollar", "Mini dólar": "Mini dollar" };
  const nomeAtivo = (nm) => (EN && NOMES_EN[nm]) || nm;
  const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const n = (v, casas) => Number(v).toLocaleString(EN ? "en-US" : "pt-BR", { minimumFractionDigits: casas, maximumFractionDigits: casas });
  function preco(i) {
    if (i.tipo === "indice" || i.simbolo.startsWith("WIN")) return `${n(i.preco, 0)} pts`;
    if (i.tipo === "moeda") return `R$ ${n(i.preco, 4)}`;
    if (i.simbolo.startsWith("WDO")) return n(i.preco, 1);
    return `R$ ${n(i.preco, 2)}`;
  }
  function variacao(v) {
    if (v == null || !isFinite(v)) return '<span class="mural-var zero">—</span>';
    const cls = v > 0.004 ? "alta" : v < -0.004 ? "baixa" : "zero";
    return `<span class="mural-var ${cls}">${v > 0 ? "▲" : v < 0 ? "▼" : ""} ${n(Math.abs(v), 2)}%</span>`;
  }
  const hora = (iso) => new Date(iso).toLocaleTimeString(EN ? "en-US" : "pt-BR", { hour: "2-digit", minute: "2-digit" });
  function nota(d) {
    const fut = d.itens.some((i) => i.tipo === "futuro");
    if (EN) return `Quotes delayed by ${esc(d.atraso)}${fut ? " · mini futures: last session's settlement" : ""} · sources: brapi.dev${d.itens.some((i) => i.tipo === "moeda") ? " and AwesomeAPI" : ""} · updated at ${hora(d.atualizado_em)}${d.em_pregao ? "" : " · market closed"}. Not investment advice.`;
    return `Cotações com atraso de ${esc(d.atraso)}${fut ? " · minicontratos: ajuste do último pregão" : ""} · fontes: brapi.dev${d.itens.some((i) => i.tipo === "moeda") ? " e AwesomeAPI" : ""} · atualizado às ${hora(d.atualizado_em)}${d.em_pregao ? "" : " · mercado fechado"}. Não é recomendação de investimento.`;
  }
  function desenhar(caixa, d) {
    const faixa = caixa.dataset.variante === "faixa", topo = caixa.dataset.variante === "topo";
    if (topo) {
      if (!d || !d.itens || !d.itens.length) { caixa.innerHTML = `<div class="mural-topo"><span class="mural-selo fechado"><i></i><span>${T("Cotações indisponíveis", "Quotes unavailable")}</span></span></div>`; return; }
      const chips = d.itens.map((i) => `<span class="mural-chip" role="listitem"><b>${esc(i.simbolo)}</b><span class="p">${preco(i)}</span>${variacao(i.variacao)}</span>`).join("");
      caixa.innerHTML = `<div class="mural-topo">
          <span class="mural-selo ${d.em_pregao ? "" : "fechado"}" title="${esc(nota(d).replace(/<[^>]+>/g, ""))}" tabindex="0"><i></i><span>${d.em_pregao ? T("Mercado · atraso 30 min", "Market · 30 min delay") : T("Mercado fechado", "Market closed")}</span></span>
          <div class="mural-anda" style="--mural-dur:${Math.max(30, d.itens.length * 4)}s">
            <div class="mural-trilho"><div class="mural-grupo" role="list" aria-label="${T("Cotações", "Quotes")}">${chips}</div><div class="mural-grupo" aria-hidden="true">${chips}</div></div></div></div>`;
      return;
    }
    if (!d || !d.itens || !d.itens.length) {
      caixa.innerHTML = `<p class="mural-nota" style="margin:0">${T("Cotações indisponíveis no momento.", "Quotes are unavailable right now.")}</p>`;
      return;
    }
    if (faixa) {
      const chips = d.itens.map((i) =>
        `<span class="mural-chip" role="listitem"><b>${esc(i.simbolo)}</b><span class="p">${preco(i)}</span>${variacao(i.variacao)}</span>`).join("");
      // ~4 segundos por cotação: devagar o bastante para ler. Passar o mouse pausa.
      caixa.innerHTML = `<div class="mural-anda" style="--mural-dur:${Math.max(30, d.itens.length * 4)}s">
          <div class="mural-trilho"><div class="mural-grupo" role="list" aria-label="${T("Cotações", "Quotes")}">${chips}</div><div class="mural-grupo" aria-hidden="true">${chips}</div></div></div>
        <p class="mural-nota" style="margin-top:4px">${nota(d)}</p>`;
    } else {
      caixa.innerHTML = `<div class="mural-grade">${d.itens.map((i) => `<div class="mural-card">
          <span class="sim">${esc(i.simbolo)}${i.tipo === "futuro" ? '<span class="mural-tag">' + T("futuro", "futures") + '</span>' : ""}</span>
          <span class="nome">${esc(nomeAtivo(i.nome))}</span>
          <span class="preco">${preco(i)}</span>
          <span>${variacao(i.variacao)}</span></div>`).join("")}</div>
        <p class="mural-nota">${nota(d)}</p>`;
    }
  }
  function esqueleto(caixa) {
    const v = caixa.dataset.variante;
    const itens = Array.from({ length: v === "cards" || !v ? 6 : 8 }, () => '<div class="mural-esq"></div>').join("");
    caixa.innerHTML = v === "topo" ? `<div class="mural-topo"><div class="mural-faixa" style="padding:0;overflow:hidden">${itens}</div></div>`
      : v === "faixa" ? `<div class="mural-faixa">${itens}</div>` : `<div class="mural-grade">${itens}</div>`;
  }
  async function atualizar(primeira) {
    if (primeira) caixas.forEach(esqueleto);
    let d = null;
    try {
      const r = await fetch("/api/cotacoes", { headers: { Accept: "application/json" } });
      if (r.ok) d = await r.json();
    } catch (e) {}
    if (d && d.itens && !d.itens.some((i) => i.tipo === "moeda")) {
      // Dólar comercial: buscado pelo navegador na AwesomeAPI (gratuita, sem chave).
      try {
        const r = await fetch("https://economia.awesomeapi.com.br/json/last/USD-BRL");
        const c = r.ok ? (await r.json()).USDBRL : null;
        if (c) {
          const usd = { simbolo: "USD", nome: "Dólar comercial", tipo: "moeda", preco: Number(c.bid), variacao: Number(c.pctChange) };
          const pos = d.itens.findIndex((i) => i.tipo === "futuro");
          d.itens.splice(pos < 0 ? d.itens.length : pos, 0, usd);
        }
      } catch (e) {}
    }
    if (d || primeira) caixas.forEach((c) => desenhar(c, d));
  }
  atualizar(true);
  setInterval(() => { if (!document.hidden) atualizar(false); }, 5 * 60 * 1000);
})();
</script>
